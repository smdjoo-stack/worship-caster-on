<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예배송출 화면</title>
<link rel="stylesheet" href="/render.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: none; }
  body.overlay { background: transparent !important; }
  body.overlay .wc-screen { background: transparent; }
  body { display: flex; align-items: center; justify-content: center; }
  #screen { width: min(100vw, calc(100vh * 16 / 9)); }
  #hint { position: fixed; left: 12px; bottom: 12px; color: #888; font: 13px sans-serif; background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 6px; transition: opacity .6s; z-index: 9; }
  #offline { position: fixed; right: 10px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: #e33; display: none; z-index: 9; }
</style>
</head>
<body>
<div id="screen" class="wc-screen"></div>
<div id="hint">F 키 또는 더블클릭 = 전체화면</div>
<div id="offline" title="서버 연결 끊김 — 재연결 중"></div>
<script src="/render.js"></script>
<script>
  // 프롬프터(/stage)는 예배당 화면과 똑같이 보여 줌 (검은화면·자막 끄기·이미지 모두 동일)
  const mode = { '/output': 'main', '/overlay': 'overlay', '/stage': 'main' }[location.pathname] || 'main';
  if (mode === 'overlay') {
    document.body.classList.add('overlay');
    // [패치] html 배경이 검정으로 남아 OBS에서 투명하지 않던 문제
    document.documentElement.style.background = 'transparent';
  }
  if (mode === 'overlay' || new URLSearchParams(location.search).has('nohint')) document.getElementById('hint').remove();
  else setTimeout(() => document.getElementById('hint')?.style.setProperty('opacity', 0), 5000);
  document.title = location.pathname === '/stage' ? '프롬프터' : { main: '예배당 화면', overlay: '방송 자막(OBS)' }[mode];

  const screen = document.getElementById('screen');
  let snap = null;

  // ── 유튜브 플레이어 조작 (운영 화면의 ▶ ⏸ ⏮ ⏪ ⏩ 🔇 버튼) ──
  // 유튜브 iframe 에 postMessage 로 명령을 보내고, 플레이어가 알려 주는 현재 재생 위치를 기억해 10초 이동에 씀
  const ytFrames = () => [...screen.querySelectorAll('iframe.wc-yt')];
  const ytSend = (f, func, args = []) => { try { f.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args }), '*'); } catch (e) {} };
  function hookYoutube() {
    ytFrames().filter(f => !f._wcHooked).forEach(f => {
      f._wcHooked = true; f._wcTime = +f.dataset.start || 0;
      // 플레이어에게 '상태를 알려 달라'고 등록 (불러온 뒤 몇 번 반복 — 늦게 준비되는 경우 대비)
      const listen = () => { try { f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'wc', channel: 'widget' }), '*'); } catch (e) {} };
      f.addEventListener('load', () => { listen(); setTimeout(listen, 1000); setTimeout(listen, 3000); });
      // 혹시 재생 소식을 못 받아도 8초 뒤에는 보이게
      setTimeout(() => f.classList.remove('wc-yt-wait'), 8000);
    });
  }
  // 재생이 시작되면(상태 1) 유튜브 시작 화면이 사라질 때까지 1.5초 더 기다렸다가 보임
  function ytPlaying(f) {
    if (!f.classList.contains('wc-yt-wait') || f._wcShowing) return;
    f._wcShowing = true;
    setTimeout(() => f.classList.remove('wc-yt-wait'), 1500);
  }
  addEventListener('message', e => {
    if (!/^https:\/\/(www\.)?youtube(-nocookie)?\.com$/.test(e.origin)) return;
    let d; try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (err) { return; }
    const f = ytFrames().find(x => x.contentWindow === e.source);
    if (f && d && d.info && typeof d.info.currentTime === 'number') f._wcTime = d.info.currentTime;
    if (f && d && d.info && d.info.playerState === 1) ytPlaying(f);
  });
  function ytCommand(cmd) {
    // 방송(OBS) 플레이어는 늘 소리 끔 — 소리는 예배당 화면 한 곳에서만 (소리 켜기 명령도 무시)
    if (mode === 'overlay' && (cmd === 'mute' || cmd === 'unmute')) return;
    for (const f of ytFrames()) {
      const t = f._wcTime || 0;
      if (cmd === 'play') ytSend(f, 'playVideo');
      else if (cmd === 'pause') ytSend(f, 'pauseVideo');
      else if (cmd === 'restart') { ytSend(f, 'seekTo', [+f.dataset.start || 0, true]); ytSend(f, 'playVideo'); }
      else if (cmd === 'back') ytSend(f, 'seekTo', [Math.max(0, t - 10), true]);
      else if (cmd === 'fwd') ytSend(f, 'seekTo', [t + 10, true]);
      else if (cmd === 'mute') ytSend(f, 'mute');
      else if (cmd === 'unmute') ytSend(f, 'unMute');
    }
  }
  function connect() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = () => {
      document.getElementById('offline').style.display = 'none';
      // [패치] 예배송출이 다시 켜졌으면(업데이트·재시작) 새 코드를 받도록 페이지를 새로고침
      fetch('/api/boot', { cache: 'no-store' }).then(r => r.json()).then(({ boot }) => {
        if (window._wcBoot && window._wcBoot !== boot) location.reload();
        window._wcBoot = boot;
      }).catch(() => {});
    };
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      // 유튜브는 예배당 화면(/output)과 방송(/overlay)에서만 실제 재생 — 프롬프터는 썸네일 (소리 겹침 방지)
      if (m.type === 'live') { snap = m; WC.render(screen, snap, mode, { player: location.pathname === '/output' || location.pathname === '/overlay' }); hookYoutube(); }
      if (m.type === 'yt') ytCommand(m.cmd);
      // [추가] 예배송출을 끄면 예배당 화면·프롬프터 창도 함께 닫힘 (OBS 자막은 OBS 안이라 화면만 비움)
      if (m.type === 'quit') {
        window._wcQuit = true;
        screen.innerHTML = '';
        if (location.pathname !== '/overlay') {
          window.close();
          // 브라우저가 닫기를 막은 경우: 검은 화면에 안내만 표시
          setTimeout(() => { document.body.innerHTML = '<div style="color:#666;font:16px sans-serif;margin:auto">예배송출이 종료되었습니다. 이 창은 닫으셔도 됩니다.</div>'; }, 400);
        }
      }
    };
    // OBS 자막은 OBS 안에 계속 떠 있으므로, 예배송출을 껐다 켜도 스스로 다시 연결 (새로고침 안 해도 됨)
    ws.onclose = () => {
      if (window._wcQuit && location.pathname !== '/overlay') return;
      if (!window._wcQuit) document.getElementById('offline').style.display = 'block';
      setTimeout(connect, window._wcQuit ? 3000 : 1000);
    };
  }
  connect();
  if (mode === 'stage') setInterval(() => snap && WC.render(screen, snap, mode, { fade: false }), 15000);

  const fs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') fs(); });
  addEventListener('dblclick', fs);
</script>
</body>
</html>
